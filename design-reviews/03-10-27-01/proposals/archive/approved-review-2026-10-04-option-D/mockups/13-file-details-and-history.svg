<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">13-file-details-and-history</title>
  <desc id="desc">Static file-navigation design proposal, not an implemented interaction.</desc>
  <rect x="0" y="0" width="1440" height="1040" rx="0" fill="#F4F5F3" />
  <text x="24" y="29" fill="#315F70" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PROPOSED — READY FOR DESIGN REVIEW</text>
  <text x="24" y="63" fill="#202826" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">13 / Other files still have a place and a way back</text>
  <text x="24" y="87" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">File details covers types without an in-app renderer. Navigation history remains available; external opening is explicit.</text>
  <rect x="24" y="132" width="880" height="822" rx="10" fill="#202928" stroke="#3C4D47" />
  <rect x="24" y="132" width="880" height="32" rx="10" fill="#1D2524" />
  <rect x="40" y="142" width="12" height="12" rx="6" fill="#FF6057" />
  <rect x="62" y="142" width="12" height="12" rx="6" fill="#FEBC2E" />
  <rect x="84" y="142" width="12" height="12" rx="6" fill="#28C840" />
  <rect x="36" y="172" width="87" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="48" y="193" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Sidebar</text>
  <text x="146" y="195" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">guide.html</text>
  <rect x="290" y="164" width="156" height="44" rx="0" fill="#202928" />
  <text x="304" y="195" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">report.pdf</text>
  <rect x="290" y="206" width="156" height="2" rx="0" fill="#91C5D6" />
  <text x="420" y="197" fill="#A8B9B1" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text>
  <rect x="728" y="172" width="162" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="740" y="193" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Documents (4)</text>
  <rect x="48" y="225" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <path d="M 67 235 L 61 241 L 67 247" fill="none" stroke="#E6EEEA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="88" y="225" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <path d="M 101 235 L 107 241 L 101 247" fill="none" stroke="#6B8078" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <text x="134" y="242" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">report.pdf</text>
  <text x="134" y="267" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">personal / docs / report.pdf</text>
  <rect x="722" y="225" width="168" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="734" y="246" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Document…</text>
  <rect x="24" y="283" width="880" height="1" rx="0" fill="#3C4D47" />
  <text x="48" y="307" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">File details · Local file · Read only</text>
  <rect x="48" y="336" width="832" height="592" rx="4" fill="#151B1B" />
  <rect x="372" y="382" width="160" height="94" rx="8" fill="#202928" stroke="#6B8078" />
  <text x="428" y="436" fill="#E6EEEA" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PDF</text>
  <text x="305" y="538" fill="#E6EEEA" font-size="27" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Preview unavailable</text>
  <text x="275" y="582" fill="#A8B9B1" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">This file type has no preview in this app.</text>
  <text x="262" y="614" fill="#A8B9B1" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Open it in its default app, or return with Back.</text>
  <rect x="252" y="660" width="209" height="32" rx="6" fill="#91C5D6" />
  <text x="264" y="681" fill="#10272E" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Open in Preview</text>
  <rect x="477" y="660" width="169" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="489" y="681" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Show in Finder</text>
  <text x="243" y="760" fill="#A8B9B1" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">report.pdf stays in this tab and in your visit history.</text>
  <text x="250" y="798" fill="#A8B9B1" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">No file is launched by merely following its link.</text>
  <rect x="928" y="132" width="488" height="822" rx="9" fill="#FFFFFF" stroke="#D8DEDA" />
  <text x="952" y="165" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">GO MENU / KEYBOARD ROUTES</text>
  <text x="952" y="211" fill="#202826" font-size="23" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Labeled history commands</text>
  <rect x="952" y="242" width="440" height="145" rx="8" fill="#1D2524" stroke="#6B8078" />
  <text x="972" y="272" fill="#E6EEEA" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Back</text>
  <text x="1321" y="271" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" />
  <text x="972" y="316" fill="#A8B9B1" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Forward</text>
  <text x="1321" y="315" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" />
  <rect x="965" y="338" width="414" height="1" rx="0" fill="#3C4D47" />
  <text x="972" y="369" fill="#E6EEEA" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Visited files…</text>
  <text x="952" y="429" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Forward disabled at latest visit; shortcuts unassigned.</text>
  <text x="952" y="458" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Back/Forward tooltips name the destination.</text>
  <text x="952" y="513" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">NEW VISIT AFTER GOING BACK</text>
  <text x="952" y="552" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Visited: README.md → guide.html → diagram.png</text>
  <text x="952" y="583" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Back: guide.html is active.</text>
  <text x="952" y="614" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Open report.pdf from a link, tree or tab.</text>
  <text x="952" y="645" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">New path: README.md → guide.html → report.pdf</text>
  <text x="952" y="676" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">The old forward path to diagram.png is cleared.</text>
  <text x="952" y="741" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PRESERVE CONTEXT</text>
  <text x="952" y="780" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Return to scroll position, zoom/pan and selection.</text>
  <text x="952" y="810" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">History navigation never means Undo or Save.</text>
  <text x="952" y="840" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Retain drafts and existing loss/conflict guards.</text>
  <text x="952" y="870" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Cancel or access failure leaves history unchanged.</text>
  <text x="24" y="994" fill="#202826" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Files without a preview open in File details, with Back/Forward and a labeled default-app action.</text>
  <text x="24" y="1019" fill="#52615C" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Open in default app requires a deliberate action and a valid handler. Launch and accessibility behavior need native testing.</text>
</svg>
