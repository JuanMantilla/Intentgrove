ystem, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  cerebro</text><text x="42" y="313" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  ormuco</text><text x="42" y="344" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌄  personal</text><text x="58" y="375" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  .agents</text><text x="58" y="406" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  PaperForge</text><text x="58" y="437" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  design-review</text><text x="58" y="468" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌄  frontend-implementation</text><text x="74" y="499" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">◇  STATE.md</text><text x="74" y="530" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  evidence</text><rect x="34" y="544" width="240" height="30" rx="4" fill="#2D4547" /><rect x="34" y="544" width="3" height="30" rx="0" fill="#91C5D6" /><text x="74" y="561" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">◇  plan.md</text><text x="74" y="592" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">◇  report.md</text><text x="58" y="623" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  md-reader</text><text x="58" y="654" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  uiux-marketing-designer</text><text x="58" y="685" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  portal</text><text x="58" y="716" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›  videos</text><rect x="24" y="841" width="260" height="1" rx="0" fill="#3C4D47" /><text x="40" y="904" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Storage &amp; recovery   ·   1 offer</text><text x="40" y="929" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Manage…</text><text x="40" y="953" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Settings…                  ⌘,</text><text x="308" y="283" fill="#91C5D6" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Editing content: Authority and design identity</text><text x="1004" y="283" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">● Unsaved  ·  ✓ Recovery saved</text><rect x="330" y="300" width="2" height="463" rx="0" fill="#91C5D6" /><text x="348" y="324" fill="#E6EEEA" font-size="29" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Authority and design identity</text><rect x="348" y="343" width="760" height="1" rx="0" fill="#3C4D47" /><text x="348" y="391" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">USER-AUTHORIZED:</text><text x="348" y="424" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Review the workspace layout and the editing workflow.</text><text x="348" y="453" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Preserve authored content and the local Markdown workspace.</text><text x="348" y="500" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Add keyboard access to project actions.</text><text x="348" y="542" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">•   Check folder search before saving.</text><rect x="634" y="525" width="2" height="25" rx="0" fill="#91C5D6" /><text x="348" y="596" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">OBSERVED AT INITIAL REVIEW:</text><text x="348" y="629" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">The current review addresses navigation, contextual actions,</text><text x="348" y="658" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">folder search, and editing directly in the reading document.</text><text x="348" y="687" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Existing approvals do not automatically approve this redesign.</text><text x="348" y="739" fill="#91C5D6" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Read the review plan</text><rect x="348" y="744" width="154" height="1" rx="0" fill="#91C5D6" /><text x="348" y="826" fill="#E6EEEA" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Implementation handoff</text><rect x="348" y="841" width="760" height="1" rx="0" fill="#3C4D47" /><text x="348" y="888" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Application source remains unchanged during this design review.</text><text x="348" y="917" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Review the proposal artifacts before approving implementation.</text><rect x="1402" y="291" width="5" height="145" rx="3" fill="#6B8078" /><text x="24" y="994" fill="#202826" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Shown: a rewritten sentence, an added paragraph and a new list item with the insertion caret.</text><text x="24" y="1019" fill="#52615C" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Type, delete, paste and restructure content in place. Formatting appears on selection; Save writes Markdown. Static design proposal.</text><g id="file-history-controls"><title>Back and Forward through visited files; available for every file type</title><rect x="308" y="199" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 327 209 L 321 215 L 327 221" fill="none" stroke="#E6EEEA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /><rect x="348" y="199" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 361 209 L 367 215 L 361 221" fill="none" stroke="#6B8078" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g></svg>