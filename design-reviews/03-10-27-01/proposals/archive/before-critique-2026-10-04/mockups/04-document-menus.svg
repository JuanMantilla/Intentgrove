<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img"><title>04-document-menus: revised static UI proposal</title><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#F4F5F3"/><text x="24" y="29" fill="#315F70" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PROPOSED — READY FOR DESIGN REVIEW</text><text x="24" y="63" fill="#202826" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">04 / Context menus with a predictable lifecycle</text><text x="24" y="87" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Context menus include shortcut hints plus content-editing and structural table commands.</text><rect x="24" y="124" width="440" height="382" rx="10" fill="#18201F" stroke="#3C4D47"/><text x="42" y="158" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Tab</text><rect x="40" y="179" width="408" height="34" rx="4" fill="#2D4547"/><text x="52" y="202" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">plan.md    ●    ×</text><rect x="50" y="225" width="388" height="212" rx="8" fill="#202928" stroke="#6B8078"/><text x="66" y="253" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Close tab</text><text x="388" y="253" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌘W</text><text x="66" y="287" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Close other tabs</text><text x="66" y="321" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Close tabs to the right</text><rect x="62" y="351" width="364" height="1" rx="0" fill="#3C4D47"/><text x="66" y="373" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Reload file</text><text x="388" y="373" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌘R</text><text x="66" y="407" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Copy file path</text><text x="42" y="488" fill="#A8B9B1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Dirty-close prompts apply to every affected tab.</text><rect x="488" y="124" width="440" height="382" rx="10" fill="#18201F" stroke="#3C4D47"/><text x="506" y="158" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Document text: editing</text><rect x="504" y="179" width="408" height="34" rx="4" fill="#2D4547"/><text x="516" y="202" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Authority and design identity</text><rect x="514" y="225" width="388" height="212" rx="8" fill="#202928" stroke="#6B8078"/><text x="530" y="253" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Undo</text><text x="852" y="253" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌘Z</text><text x="530" y="287" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Redo</text><text x="838" y="287" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⇧⌘Z</text><rect x="526" y="317" width="364" height="1" rx="0" fill="#3C4D47"/><text x="530" y="339" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Cut</text><text x="852" y="339" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌘X</text><text x="530" y="373" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Copy selection</text><text x="852" y="373" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌘C</text><text x="530" y="407" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Paste</text><text x="852" y="407" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">⌘V</text><text x="506" y="488" fill="#A8B9B1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Cut / Copy disable without a selection; typing edits content.</text><rect x="952" y="124" width="464" height="410" rx="10" fill="#18201F" stroke="#3C4D47"/><text x="970" y="158" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Editing: table cell</text><rect x="968" y="179" width="432" height="34" rx="4" fill="#2D4547"/><text x="980" y="202" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Behaviour | Reading | Editing</text><rect x="978" y="225" width="412" height="264" rx="8" fill="#202928" stroke="#6B8078"/><text x="994" y="253" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Insert row above</text><text x="994" y="287" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Insert row below</text><rect x="990" y="317" width="388" height="1" rx="0" fill="#3C4D47"/><text x="994" y="339" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Insert column left</text><text x="994" y="373" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Insert column right</text><rect x="990" y="403" width="388" height="1" rx="0" fill="#3C4D47"/><text x="994" y="425" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Delete row…</text><text x="994" y="459" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Delete column…</text><text x="970" y="516" fill="#A8B9B1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Delete acts on the named row/column and supports Undo.</text><rect x="24" y="544" width="1392" height="352" rx="10" fill="#202928" stroke="#3C4D47"/><text x="48" y="589" fill="#E6EEEA" font-size="22" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Dismissal and focus contract</text><text x="48" y="630" fill="#91C5D6" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Outside click / Escape</text><text x="330" y="629" fill="#E6EEEA" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Close immediately; Escape returns to the invoker. An outside click keeps focus at its destination.</text><text x="48" y="684" fill="#91C5D6" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Action / another menu</text><text x="330" y="683" fill="#E6EEEA" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Action closes before it runs. A new menu replaces the old one; never stack detached controls.</text><text x="48" y="738" fill="#91C5D6" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Scroll / target change</text><text x="330" y="737" fill="#E6EEEA" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Close on scrolling, tab switch, target invalidation or window blur; keep caret and reading anchor.</text><text x="48" y="792" fill="#91C5D6" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Keyboard</text><text x="330" y="791" fill="#E6EEEA" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Arrow keys navigate; Return activates; Escape closes. Unavailable actions state a specific reason.</text><text x="48" y="861" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Document… exposes Copy path, Show path, Show in Explorer, Reload and the editing recovery commands.</text><text x="24" y="994" fill="#202826" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">“Edit section here” remains a targeting shortcut into rich in-place editing, with explicit section boundaries.</text><text x="24" y="1019" fill="#52615C" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Displayed shortcuts use the current command scope. Tab/file Reload shortcuts act on the active file; unmapped actions have no hint.</text></svg>