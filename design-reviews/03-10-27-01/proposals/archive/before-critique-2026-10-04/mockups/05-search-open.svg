<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img"><title>05-search-open: revised static UI proposal</title><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#F4F5F3" /><text x="24" y="29" fill="#315F70" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PROPOSED — READY FOR DESIGN REVIEW</text><text x="24" y="63" fill="#202826" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">05 / An explicit, integrated search surface</text><text x="24" y="87" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Search replaces the tree temporarily; the document and active tab remain in place.</text><rect x="24" y="108" width="1392" height="854" rx="10" fill="#202928" stroke="#3C4D47" /><rect x="24" y="108" width="1392" height="32" rx="10" fill="#1D2524" /><rect x="40" y="118" width="12" height="12" rx="6" fill="#FF6057" /><rect x="62" y="118" width="12" height="12" rx="6" fill="#FEBC2E" /><rect x="84" y="118" width="12" height="12" rx="6" fill="#28C840" /><text x="615" y="129" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Markdown workspace</text><rect x="24" y="140" width="340" height="822" rx="0" fill="#18201F" /><rect x="364" y="140" width="1052" height="44" rx="0" fill="#1D2524" /><rect x="364" y="184" width="1052" height="74" rx="0" fill="#202928" /><rect x="364" y="184" width="1052" height="1" rx="0" fill="#3C4D47" /><rect x="364" y="258" width="1052" height="1" rx="0" fill="#3C4D47" /><rect x="364" y="140" width="153" height="44" rx="0" fill="#1D2524" /><text x="378" y="168" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">AGENTS.md</text><text x="492" y="170" fill="#A8B9B1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text><rect x="516" y="140" width="1" height="44" rx="0" fill="#3C4D47" /><rect x="517" y="140" width="168" height="44" rx="0" fill="#1D2524" /><text x="531" y="168" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">README.md</text><text x="660" y="170" fill="#A8B9B1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text><rect x="684" y="140" width="1" height="44" rx="0" fill="#3C4D47" /><rect x="685" y="140" width="154" height="44" rx="0" fill="#202928" /><text x="699" y="168" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">plan.md</text><text x="814" y="170" fill="#A8B9B1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text><rect x="838" y="140" width="1" height="44" rx="0" fill="#3C4D47" /><rect x="685" y="182" width="154" height="2" rx="0" fill="#91C5D6" /><rect x="839" y="140" width="145" height="44" rx="0" fill="#1D2524" /><text x="853" y="168" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">report.md</text><text x="959" y="170" fill="#A8B9B1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text><rect x="983" y="140" width="1" height="44" rx="0" fill="#3C4D47" /><text x="1000" y="173" fill="#A8B9B1" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">›</text><rect x="1235" y="146" width="166" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="1247" y="167" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Documents (29) ⌄</text><text x="474" y="215" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">plan.md</text><text x="474" y="240" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">personal / frontend-implementation</text><rect x="973" y="199" width="67" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="985" y="220" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Edit</text><rect x="1050" y="199" width="84" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="1062" y="220" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Outline</text><rect x="1144" y="199" width="82" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="1156" y="220" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Aa  Read</text><rect x="1236" y="199" width="165" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="1248" y="220" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Document…</text><rect x="364" y="140" width="1" height="822" rx="0" fill="#3C4D47" /><text x="388" y="283" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Rendered Markdown  ·  Local file</text><text x="428" y="324" fill="#E6EEEA" font-size="29" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Authority and design identity</text><rect x="428" y="343" width="760" height="1" rx="0" fill="#3C4D47" /><text x="428" y="391" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">USER-AUTHORIZED:</text><text x="428" y="424" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Review design-review/ and relevant frontend code.</text><text x="428" y="453" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Preserve authored content and the local Markdown workspace.</text><text x="428" y="506" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">OBSERVED AT INITIAL REVIEW:</text><text x="428" y="539" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">The current review addresses navigation, contextual actions,</text><text x="428" y="568" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">folder search, and editing directly in the reading document.</text><text x="428" y="597" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Existing approvals do not automatically approve this redesign.</text><text x="428" y="649" fill="#91C5D6" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Read the review plan</text><rect x="428" y="654" width="154" height="1" rx="0" fill="#91C5D6" /><text x="428" y="736" fill="#E6EEEA" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Implementation handoff</text><rect x="428" y="751" width="760" height="1" rx="0" fill="#3C4D47" /><text x="428" y="798" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Application source remains unchanged during this design review.</text><text x="428" y="827" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Review the proposal artifacts before approving implementation.</text><text x="428" y="878" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">•   Local Markdown files remain the source of truth.</text><text x="428" y="913" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">•   Save and recovery status remain separate.</text><rect x="1402" y="291" width="5" height="145" rx="3" fill="#6B8078" /><text x="40" y="169" fill="#91C5D6" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">‹  Return to Explorer</text><text x="40" y="213" fill="#E6EEEA" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Search workspace</text><text x="40" y="246" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Scope</text><rect x="40" y="258" width="308" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="52" y="279" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Entire workspace: projects   ⌄</text><text x="40" y="320" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Find</text><rect x="40" y="332" width="308" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><rect x="36" y="328" width="316" height="40" rx="8" fill="none" stroke="#91C5D6" /><text x="52" y="353" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Enter a query…</text><text x="40" y="390" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Match</text><rect x="40" y="402" width="98" height="32" rx="5" fill="#1D2524" stroke="#6B8078" /><text x="53" y="424" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Names</text><rect x="143" y="402" width="98" height="32" rx="5" fill="#2D4547" stroke="#91C5D6" /><text x="156" y="424" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Contents</text><rect x="246" y="402" width="102" height="32" rx="5" fill="#1D2524" stroke="#6B8078" /><text x="259" y="424" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Both</text><text x="40" y="462" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">☐  Include ignored files</text><text x="40" y="489" fill="#A8B9B1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Uses .gitignore and workspace exclusions.</text><rect x="40" y="512" width="92" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="52" y="533" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Search</text><rect x="144" y="512" width="89" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="156" y="533" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Clear</text><rect x="40" y="566" width="308" height="1" rx="0" fill="#3C4D47" /><text x="40" y="613" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Search local Markdown</text><text x="40" y="642" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Choose filenames, document contents,</text><text x="40" y="668" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">or both. Press Return to search.</text><text x="40" y="718" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Search includes workspace subfolders.</text><text x="40" y="743" fill="#A8B9B1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Individually opened outside files are excluded.</text><text x="24" y="994" fill="#202826" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Scope and matching mode are separate, explicit choices. Clear removes the query; Return restores the tree.</text><text x="24" y="1019" fill="#52615C" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Counts and hits are illustrative. During scanning, Stop replaces Clear; incomplete and skipped results receive explicit labels.</text><g id="file-history-controls"><title>Back and Forward through visited files; available for every file type</title><rect x="388" y="199" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 407 209 L 401 215 L 407 221" fill="none" stroke="#E6EEEA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /><rect x="428" y="199" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 441 209 L 447 215 L 441 221" fill="none" stroke="#6B8078" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g></svg>