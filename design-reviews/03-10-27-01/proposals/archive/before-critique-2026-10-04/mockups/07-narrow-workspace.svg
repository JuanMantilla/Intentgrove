<svg xmlns="http://www.w3.org/2000/svg" width="720" height="890" viewBox="0 0 720 890" role="img"><title>07-narrow-workspace: revised static UI proposal</title><rect x="0" y="0" width="720" height="890" rx="0" fill="#F4F5F3" /><text x="24" y="29" fill="#315F70" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PROPOSED — READY FOR DESIGN REVIEW</text><text x="24" y="63" fill="#202826" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">07 / At 640 logical units</text><text x="24" y="87" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Content-driven collapse preserves readable tabs and deliberate Edit.</text><rect x="40" y="116" width="640" height="656" rx="10" fill="#202928" stroke="#3C4D47" /><rect x="40" y="116" width="640" height="32" rx="0" fill="#1D2524" /><rect x="56" y="126" width="12" height="12" rx="6" fill="#FF6057" /><rect x="78" y="126" width="12" height="12" rx="6" fill="#FEBC2E" /><rect x="100" y="126" width="12" height="12" rx="6" fill="#28C840" /><text x="279" y="137" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Markdown workspace</text><rect x="40" y="148" width="640" height="44" rx="0" fill="#1D2524" /><rect x="50" y="154" width="88" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="62" y="175" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Sidebar</text><text x="157" y="176" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">plan.md</text><text x="269" y="178" fill="#A8B9B1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text><rect x="146" y="190" width="147" height="2" rx="0" fill="#91C5D6" /><text x="314" y="176" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">report.md</text><text x="423" y="178" fill="#A8B9B1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text><rect x="481" y="154" width="188" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="493" y="175" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Documents (29) ⌄</text><text x="150" y="226" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">plan.md</text><text x="150" y="253" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">personal / frontend-implementation</text><rect x="460" y="210" width="67" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="472" y="231" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Edit</text><rect x="539" y="210" width="117" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="551" y="231" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Document…</text><rect x="40" y="274" width="640" height="1" rx="0" fill="#3C4D47" /><text x="64" y="334" fill="#E6EEEA" font-size="28" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Authority and</text><text x="64" y="369" fill="#E6EEEA" font-size="28" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">design identity</text><rect x="64" y="390" width="592" height="1" rx="0" fill="#3C4D47" /><text x="64" y="431" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">USER-AUTHORIZED:</text><text x="64" y="460" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Review design-review/ and relevant frontend code.</text><text x="64" y="489" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Preserve authored content and the local Markdown</text><text x="64" y="518" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">workspace.</text><text x="64" y="547" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" /><text x="64" y="576" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">OBSERVED AT INITIAL REVIEW:</text><text x="64" y="605" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">The current review addresses navigation, contextual</text><text x="64" y="634" fill="#E6EEEA" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">actions, folder search, and direct in-place editing.</text><text x="64" y="735" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Sidebar opens as a dismissible overlay.</text><text x="24" y="844" fill="#202826" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">At narrow widths, Outline and Reading settings move into the labeled Document… menu.</text><text x="24" y="869" fill="#52615C" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Static proposal. Minimum-window and enlarged-text behavior remain NOT TESTED.</text><g id="file-history-controls"><title>Back and Forward through visited files; available for every file type</title><rect x="64" y="210" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 83 220 L 77 226 L 83 232" fill="none" stroke="#E6EEEA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /><rect x="104" y="210" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 117 220 L 123 226 L 117 232" fill="none" stroke="#6B8078" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g></svg>