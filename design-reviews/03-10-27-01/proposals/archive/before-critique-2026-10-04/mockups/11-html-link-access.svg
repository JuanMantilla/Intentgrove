<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title desc"><title id="title">11-html-link-access</title><desc id="desc">Static design proposal. Illustrative local HTML with authored CSS; JavaScript disabled. Runtime behavior is not demonstrated.</desc><rect x="0" y="0" width="960" height="900" rx="0" fill="#F4F5F3" /><text x="24" y="29" fill="#315F70" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PROPOSED — READY FOR DESIGN REVIEW</text><text x="24" y="63" fill="#202826" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">11 / A local link needs access</text><text x="24" y="87" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Narrow window example: retain the source document while the user resolves a linked file.</text><rect x="24" y="108" width="912" height="704" rx="10" fill="#202928" stroke="#3C4D47" /><rect x="24" y="108" width="912" height="32" rx="10" fill="#1D2524" /><rect x="40" y="118" width="12" height="12" rx="6" fill="#FF6057" /><rect x="62" y="118" width="12" height="12" rx="6" fill="#FEBC2E" /><rect x="84" y="118" width="12" height="12" rx="6" fill="#28C840" /><rect x="36" y="147" width="87" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="48" y="168" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Sidebar</text><rect x="134" y="140" width="162" height="44" rx="0" fill="#202928" /><text x="146" y="168" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">guide.html</text><text x="270" y="171" fill="#A8B9B1" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">×</text><rect x="134" y="182" width="162" height="2" rx="0" fill="#91C5D6" /><rect x="760" y="146" width="163" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="772" y="167" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Documents (2)</text><path d="M 899 159.5 L 904 164.5 L 909 159.5" fill="none" stroke="#A8B9B1" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /><text x="134" y="221" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">guide.html</text><text x="134" y="246" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">personal / docs</text><rect x="754" y="199" width="169" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="766" y="220" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Document…</text><rect x="24" y="263" width="912" height="1" rx="0" fill="#3C4D47" /><text x="48" y="290" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">HTML + CSS  ·  Local file  ·  Read only</text><text x="792" y="290" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">JavaScript off</text><rect x="48" y="310" width="864" height="478" rx="4" fill="#FFFDF9" /><text x="80" y="366" fill="#202826" font-size="30" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Workspace guide</text><text x="80" y="401" fill="#52615C" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Read the report for project documentation details.</text><text x="80" y="453" fill="#315F70" font-size="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Project report</text><rect x="80" y="457" width="104.74" height="1" rx="0" fill="#315F70" /><text x="80" y="739" fill="#52615C" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Open a project folder and choose a document from the tree.</text><rect x="172" y="458" width="616" height="235" rx="10" fill="#1D2524" stroke="#6B8078" /><text x="196" y="500" fill="#E6EEEA" font-size="22" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Choose the linked file to continue</text><text x="196" y="534" fill="#A8B9B1" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">This file is outside the folder you opened.</text><text x="196" y="563" fill="#A8B9B1" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Selecting it grants access to that file only.</text><rect x="196" y="582" width="568" height="35" rx="4" fill="#151B1B" /><text x="208" y="605" fill="#E6EEEA" font-size="14" font-family="monospace" font-weight="400">../../reports/report.pdf</text><rect x="488" y="637" width="92" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><text x="500" y="658" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Cancel</text><rect x="592" y="637" width="172" height="32" rx="6" fill="#91C5D6" /><rect x="588" y="633" width="180" height="40" rx="8" fill="none" stroke="#91C5D6" /><text x="604" y="658" fill="#10272E" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Choose file…</text><text x="24" y="854" fill="#202826" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Explicit file access keeps the original page, tabs and reading position intact.</text><text x="24" y="879" fill="#52615C" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Cancel or Escape returns focus to the link. A missing file uses “Linked file not found” with a selectable path and Close.</text><g id="file-history-controls"><title>Back and Forward through visited files; available for every file type</title><rect x="48" y="203" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 67 213 L 61 219 L 67 225" fill="none" stroke="#E6EEEA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /><rect x="88" y="203" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" /><path d="M 101 213 L 107 219 L 101 225" fill="none" stroke="#6B8078" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></g></svg>