  <title>IntentGrove — direct rendered section editing, documentation revision 2026-10-08</title>
  <desc>Static design handoff, not runtime acceptance. Deliberate Edit section entry, one section edited in the existing document scroll surface, contextual formatting and block actions, opaque Mermaid preservation, explicit Save and Save As, Undo and Redo. Earlier F004 source/live-preview is superseded. CRLF Save remains deferred. Historical approval snapshots are unchanged. Option D remains the controlling shell navigation reference; the inherited header arrows in this mixed mockup are superseded by selected-design-handoff.md and are outside this editing revision.</desc>
