<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">10-html-links</title>
  <desc id="desc">Static file-navigation design proposal, not an implemented interaction.</desc>
  <rect x="0" y="0" width="1440" height="1040" rx="0" fill="#F4F5F3" />
  <text x="24" y="29" fill="#315F70" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">PROPOSED — READY FOR DESIGN REVIEW</text>
  <text x="24" y="63" fill="#202826" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">10 / Follow a document link to any local file</text>
  <text x="24" y="87" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">A link inside the document can point to HTML, Markdown, an image or another file. The destination type determines its view.</text>
  <rect x="24" y="118" width="452" height="835" rx="9" fill="#FFFFFF" stroke="#D8DEDA" />
  <rect x="494" y="118" width="452" height="835" rx="9" fill="#FFFFFF" stroke="#D8DEDA" />
  <rect x="964" y="118" width="452" height="835" rx="9" fill="#FFFFFF" stroke="#D8DEDA" />
  <text x="48" y="155" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">SOURCE DOCUMENT</text>
  <text x="48" y="195" fill="#202826" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Links inside guide.html</text>
  <text x="48" y="235" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">These are authored links in the rendered</text>
  <text x="48" y="260" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">document, not project-tree shortcuts.</text>
  <rect x="48" y="300" width="404" height="265" rx="5" fill="#FFFDF9" stroke="#D8DEDA" />
  <rect x="48" y="300" width="404" height="36" rx="5" fill="#1D2524" />
  <text x="64" y="323" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">guide.html</text>
  <text x="68" y="388" fill="#202826" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Project resources</text>
  <text x="68" y="434" fill="#315F70" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Release notes</text>
  <rect x="68" y="438" width="101.33" height="1" rx="0" fill="#315F70" />
  <text x="68" y="472" fill="#315F70" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Markdown overview</text>
  <rect x="68" y="476" width="144.05" height="1" rx="0" fill="#315F70" />
  <text x="68" y="510" fill="#315F70" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Workspace diagram</text>
  <rect x="68" y="514" width="144.08" height="1" rx="0" fill="#315F70" />
  <text x="68" y="548" fill="#315F70" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Project report</text>
  <rect x="68" y="552" width="99.89" height="1" rx="0" fill="#315F70" />
  <text x="48" y="611" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">EXAMPLE DESTINATIONS IN HREF</text>
  <rect x="48" y="633" width="404" height="126" rx="5" fill="#1D2524" stroke="#6B8078" />
  <text x="64" y="657" fill="#E6EEEA" font-size="14" font-family="monospace" font-weight="400">release-notes.html#v1</text>
  <text x="64" y="683" fill="#E6EEEA" font-size="14" font-family="monospace" font-weight="400">README.md</text>
  <text x="64" y="709" fill="#E6EEEA" font-size="14" font-family="monospace" font-weight="400">images/diagram.png</text>
  <text x="64" y="735" fill="#E6EEEA" font-size="14" font-family="monospace" font-weight="400">report.pdf</text>
  <text x="48" y="814" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Resolve relative to the source file.</text>
  <text x="48" y="840" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Click or Return follows the link.</text>
  <text x="48" y="866" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">HTML navigation does not need scripts.</text>
  <text x="518" y="155" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">DIRECT ACTIVATION</text>
  <text x="518" y="195" fill="#202826" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Open the linked file</text>
  <text x="518" y="235" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">The same route handles local file links</text>
  <text x="518" y="260" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">in HTML and supported Markdown.</text>
  <text x="518" y="308" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">OPTIONAL SECONDARY-CLICK MENU</text>
  <rect x="518" y="337" width="404" height="174" rx="8" fill="#1D2524" stroke="#6B8078" />
  <rect x="525" y="348" width="390" height="32" rx="4" fill="#2D4547" />
  <text x="535" y="365" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Open linked file</text>
  <text x="838" y="364" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" />
  <text x="535" y="404" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Copy link address</text>
  <text x="838" y="403" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" />
  <text x="535" y="443" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Copy link text</text>
  <text x="838" y="442" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" />
  <text x="535" y="482" fill="#E6EEEA" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">View destination details…</text>
  <text x="838" y="481" fill="#A8B9B1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400" />
  <text x="518" y="611" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">SHARED VISIT HISTORY</text>
  <rect x="518" y="633" width="404" height="126" rx="5" fill="#1D2524" stroke="#6B8078" />
  <rect x="534" y="650" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <path d="M 553 660 L 547 666 L 553 672" fill="none" stroke="#E6EEEA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="574" y="650" width="32" height="32" rx="6" fill="#1D2524" stroke="#6B8078" />
  <path d="M 587 660 L 593 666 L 587 672" fill="none" stroke="#E6EEEA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <text x="624" y="674" fill="#E6EEEA" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Back / Forward</text>
  <text x="534" y="718" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Return to the source file and its position.</text>
  <text x="534" y="745" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Visit history works across all file types.</text>
  <text x="518" y="814" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">File links, tree opens, search results and</text>
  <text x="518" y="840" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">tab switches share the same history.</text>
  <text x="518" y="866" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Missing or ungranted file: see screen 11.</text>
  <text x="988" y="155" fill="#315F70" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">DESTINATION FILE</text>
  <text x="988" y="195" fill="#202826" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Use the appropriate view</text>
  <text x="988" y="235" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Activate an existing tab, or open an</text>
  <text x="988" y="260" fill="#52615C" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">adjacent tab. Preserve the source state.</text>
  <rect x="988" y="300" width="404" height="99" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="1008" y="332" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">HTML / HTM</text>
  <text x="1008" y="367" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Rendered HTML with its local CSS.</text>
  <rect x="988" y="415" width="404" height="99" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="1008" y="447" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Markdown</text>
  <text x="1008" y="482" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Rendered reading / retained rich draft.</text>
  <rect x="988" y="530" width="404" height="99" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="1008" y="562" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Supported image</text>
  <text x="1008" y="597" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Image view with zoom and pan.</text>
  <rect x="988" y="645" width="404" height="99" rx="6" fill="#1D2524" stroke="#6B8078" />
  <text x="1008" y="677" fill="#E6EEEA" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">Other file</text>
  <text x="1008" y="712" fill="#A8B9B1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">File details; explicit default-app action.</text>
  <text x="988" y="814" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Never treat every target as HTML.</text>
  <text x="988" y="840" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">No extra renderer is silently promised.</text>
  <text x="988" y="866" fill="#52615C" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Back/Forward also works in File details.</text>
  <text x="24" y="994" fill="#202826" font-size="15" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600">The HTML example does not limit link targets. Back/Forward belongs to the whole file workspace.</text>
  <text x="24" y="1019" fill="#52615C" font-size="13" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="400">Static flow only. File access, supported rendering, default-app launch and visit-history traversal remain NOT TESTED.</text>
</svg>
