[workspace]
members = ["igproto-model", "igproto-package", "igproto-compiler", "igproto-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
schemars = "=1.2.2"

sha2 = "=0.10.9"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
roxmltree = "=0.21.1"
svgtypes = "=0.16.1"
cssparser = "=0.36.0"
png = "=0.18.1"
base64 = "=0.22.1"
rustix = { version = "=1.1.2", features = ["fs"] }
crc32fast = "=1.5.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
