[package]
name = "md_reader"
version = "0.1.0"
description = "Intentgrove — a document workspace for clearer communication with AI"
authors = ["Juan Mantilla"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
acceptance-harness = []
settings-contract-tests = ["tauri/test"]

[build-dependencies]
serde_json = "=1.0.151"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
notify = "=8.2.0"
sha2 = "=0.10.9"
pulldown-cmark = "=0.13.4"
serde_json = "=1.0.151"
ignore = "=0.4.22"
globset = "=0.4.14"
regex = "=1.12.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Threading"] }
