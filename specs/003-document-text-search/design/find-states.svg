<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Document Find states</title>
  <desc id="desc">A Markdown reader with an in-flow Find band, highlighted active match, zero-results state and unavailable state.</desc>
  <rect width="1200" height="760" fill="#e8ece9"/>
  <g font-family="-apple-system, sans-serif">
    <text x="50" y="48" font-size="24" font-weight="700" fill="#202826">F003S · Find in document</text>
    <text x="50" y="72" font-size="14" fill="#52615c">Visual proposal · active result remains in view</text>
    <rect x="50" y="100" width="1100" height="415" rx="12" fill="#fff" stroke="#c8d0cb"/>
    <rect x="50" y="100" width="1100" height="34" rx="12" fill="#f1f3f1"/>
    <circle cx="73" cy="117" r="5" fill="#e37b72"/><circle cx="90" cy="117" r="5" fill="#e7c66c"/><circle cx="107" cy="117" r="5" fill="#82ba83"/>
    <rect x="50" y="134" width="210" height="381" fill="#eef0ee"/>
    <text x="72" y="166" font-size="14" fill="#202826" font-weight="700">docs</text>
    <text x="72" y="198" font-size="13" fill="#52615c">◇ guide.md</text>
    <rect x="260" y="134" width="890" height="43" fill="#f8f9f8"/>
    <text x="282" y="161" font-size="14" fill="#202826">guide.md</text>
    <rect x="260" y="177" width="890" height="54" fill="#f0f5f3" stroke="#d8deda"/>
    <text x="280" y="210" font-size="13" fill="#202826">Find</text>
    <rect x="320" y="187" width="410" height="34" rx="6" fill="#fff" stroke="#315f70" stroke-width="2"/>
    <text x="334" y="209" font-size="13" fill="#202826">workspace</text>
    <text x="748" y="209" font-size="13" fill="#202826">2 of 7</text>
    <text x="837" y="209" font-size="15" fill="#315f70">↑</text>
    <text x="877" y="209" font-size="15" fill="#315f70">↓</text>
    <text x="919" y="209" font-size="15" fill="#52615c">×</text>
    <text x="400" y="290" font-size="26" font-weight="700" fill="#202826">Workspace guide</text>
    <text x="400" y="334" font-size="16" fill="#202826">A quiet </text>
    <rect x="462" y="314" width="100" height="26" rx="3" fill="#d5e6df"/>
    <text x="468" y="334" font-size="16" fill="#202826" text-decoration="underline">workspace</text>
    <text x="568" y="334" font-size="16" fill="#202826"> keeps reading context visible.</text>
    <text x="400" y="379" font-size="16" fill="#202826">Find another </text>
    <rect x="499" y="358" width="107" height="27" rx="3" fill="#d5e6df" stroke="#315f70" stroke-width="2"/>
    <text x="504" y="379" font-size="16" fill="#202826" text-decoration="underline">workspace</text>
    <text x="613" y="379" font-size="16" fill="#202826"> reference here.</text>
    <text x="50" y="548" font-size="17" font-weight="700" fill="#202826">1  Matches · active 2 of 7</text>

    <rect x="50" y="579" width="530" height="128" rx="10" fill="#fff" stroke="#c8d0cb"/>
    <text x="75" y="612" font-size="16" font-weight="700" fill="#202826">No matches</text>
    <text x="75" y="642" font-size="13" fill="#52615c">Try another word. The document is unchanged.</text>
    <rect x="620" y="579" width="530" height="128" rx="10" fill="#fff" stroke="#c8d0cb"/>
    <text x="645" y="612" font-size="16" font-weight="700" fill="#202826">Find unavailable</text>
    <text x="645" y="642" font-size="13" fill="#52615c">This document could not be read completely.</text>
    <text x="645" y="674" font-size="13" fill="#315f70">Retry document</text>
    <text x="50" y="735" font-size="15" fill="#202826">2  Zero results</text>
    <text x="620" y="735" font-size="15" fill="#202826">3  Unavailable content</text>
  </g>
</svg>
