<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">External refresh visual proposal</title>
  <desc id="desc">Two schematic macOS reader states. The first shows Reload in a file context menu. The second shows a persistent conflict notice and read-only local and disk version panels.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; fill: #202826; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .muted { fill: #52615c; }
      .accent { fill: #315f70; }
      .white { fill: #fff; }
      .line { stroke: #d8deda; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="780" fill="#f4f5f3"/>
  <text x="28" y="35" class="label">1  RELOAD FROM THE FILE MENU</text>
  <text x="748" y="35" class="label">2  UNSAVED EDIT WITH A DISK CONFLICT</text>

  <!-- Left: file context menu in the approved reader shell -->
  <rect x="20" y="56" width="680" height="684" rx="10" fill="#fff" stroke="#d8deda"/>
  <rect x="21" y="57" width="678" height="64" rx="9" fill="#f8f9f7"/>
  <circle cx="40" cy="76" r="5" fill="#ff5f57"/><circle cx="57" cy="76" r="5" fill="#febc2e"/><circle cx="74" cy="76" r="5" fill="#28c840"/>
  <text x="361" y="82" text-anchor="middle" class="small muted">docs / README.md</text>
  <text x="38" y="108" class="body">☰  Workspace</text>
  <text x="635" y="108" class="small muted">Local only</text>
  <line x1="21" y1="120" x2="699" y2="120" class="line"/>
  <rect x="21" y="121" width="192" height="618" fill="#eef0ee"/>
  <line x1="213" y1="121" x2="213" y2="739" class="line"/>
  <text x="39" y="150" class="small muted">EXPLORER</text>
  <text x="39" y="180" class="body">⌄  docs</text>
  <text x="53" y="210" class="small muted">⌄  guides</text>
  <rect x="31" y="222" width="174" height="34" rx="5" fill="#dee9e8"/>
  <text x="51" y="244" class="body">◇  README.md</text>
  <text x="53" y="283" class="body muted">◇  setup.md</text>
  <text x="38" y="711" class="small muted">Markdown only · Local</text>
  <rect x="214" y="121" width="485" height="40" fill="#f8f9f7"/>
  <text x="234" y="146" class="body">README.md</text>
  <line x1="214" y1="160" x2="699" y2="160" class="line"/>
  <text x="256" y="219" class="small muted">DOCS / GUIDES / README.MD</text>
  <text x="256" y="272" font-size="29" font-weight="700">Build notes</text>
  <text x="256" y="310" class="body">The latest confirmed document stays readable</text>
  <text x="256" y="332" class="body">while the selected file is checked.</text>
  <line x1="256" y1="357" x2="654" y2="357" class="line"/>
  <text x="256" y="398" font-size="20" font-weight="700">Getting started</text>
  <text x="256" y="430" class="body muted">Current passage remains in place.</text>
  <rect x="97" y="244" width="246" height="104" rx="7" fill="#ffffff" stroke="#c5cfca"/>
  <rect x="103" y="250" width="234" height="38" rx="4" fill="#dee9e8"/>
  <text x="120" y="275" class="body" font-weight="600">↻  Reload README.md</text>
  <line x1="104" y1="294" x2="336" y2="294" class="line"/>
  <text x="120" y="324" class="small muted">Checks this file only</text>
  <rect x="228" y="677" width="194" height="32" rx="6" fill="#f3f6f5" stroke="#d8deda"/>
  <text x="242" y="698" class="small">↻  Updated from disk</text>

  <!-- Right: conflict notice and comparison -->
  <rect x="740" y="56" width="680" height="684" rx="10" fill="#fff" stroke="#d8deda"/>
  <rect x="741" y="57" width="678" height="64" rx="9" fill="#f8f9f7"/>
  <circle cx="760" cy="76" r="5" fill="#ff5f57"/><circle cx="777" cy="76" r="5" fill="#febc2e"/><circle cx="794" cy="76" r="5" fill="#28c840"/>
  <text x="1080" y="82" text-anchor="middle" class="small muted">docs / README.md</text>
  <text x="758" y="108" class="body">☰  Workspace</text>
  <text x="1355" y="108" class="small muted">Local only</text>
  <line x1="741" y1="120" x2="1419" y2="120" class="line"/>
  <rect x="741" y="121" width="170" height="618" fill="#eef0ee"/>
  <line x1="911" y1="121" x2="911" y2="739" class="line"/>
  <text x="758" y="150" class="small muted">EXPLORER</text>
  <text x="758" y="181" class="body">⌄  docs</text>
  <rect x="752" y="194" width="149" height="34" rx="5" fill="#dee9e8"/>
  <text x="763" y="216" class="body">◇  README.md</text>
  <rect x="912" y="121" width="507" height="40" fill="#f8f9f7"/>
  <text x="929" y="146" class="body">README.md  ●</text>
  <text x="1070" y="146" class="small muted">Unsaved · Conflict</text>
  <line x1="912" y1="160" x2="1419" y2="160" class="line"/>
  <rect x="927" y="179" width="476" height="151" rx="7" fill="#f3f6f5" stroke="#d8deda"/>
  <rect x="927" y="179" width="4" height="151" rx="2" fill="#315f70"/>
  <text x="945" y="205" class="body" font-weight="700">This file changed in another app.</text>
  <text x="945" y="226" class="body">Your edit is safe.</text>
  <text x="945" y="252" class="small muted">Compare both versions before choosing.</text>
  <rect x="943" y="270" width="102" height="30" rx="5" fill="#315f70"/>
  <text x="994" y="290" text-anchor="middle" class="small white">Inspect versions</text>
  <rect x="1051" y="270" width="93" height="30" rx="5" fill="#ffffff" stroke="#b8c5c0"/>
  <text x="1097" y="290" text-anchor="middle" class="small">Keep my edit</text>
  <rect x="1150" y="270" width="105" height="30" rx="5" fill="#ffffff" stroke="#b8c5c0"/>
  <text x="1202" y="290" text-anchor="middle" class="small">Use disk version</text>
  <rect x="1261" y="270" width="126" height="30" rx="5" fill="#ffffff" stroke="#b8c5c0"/>
  <text x="1324" y="290" text-anchor="middle" class="small">Save a copy</text>
  <text x="929" y="368" class="small muted">READ-ONLY COMPARISON</text>
  <rect x="927" y="382" width="228" height="226" rx="6" fill="#ffffff" stroke="#d8deda"/>
  <rect x="1165" y="382" width="238" height="226" rx="6" fill="#ffffff" stroke="#d8deda"/>
  <text x="942" y="410" class="label">Your unsaved edit</text>
  <text x="1180" y="410" class="label">Current disk version</text>
  <line x1="938" y1="424" x2="1144" y2="424" class="line"/>
  <line x1="1176" y1="424" x2="1392" y2="424" class="line"/>
  <text x="942" y="452" class="small muted"># Build notes</text>
  <text x="942" y="476" class="body">My edited section text</text>
  <text x="942" y="500" class="body">is retained as a draft.</text>
  <text x="1180" y="452" class="small muted"># Build notes</text>
  <text x="1180" y="476" class="body">New content saved by</text>
  <text x="1180" y="500" class="body">the other application.</text>
  <text x="942" y="579" class="small muted">Not written to original</text>
  <text x="1180" y="579" class="small muted">Latest confirmed disk file</text>
  <text x="928" y="650" class="small muted">The editor stays available behind this comparison.</text>
</svg>
