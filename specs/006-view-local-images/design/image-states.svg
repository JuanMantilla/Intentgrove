<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Local image viewer proposal</title>
  <desc id="desc">Read-only image tab with Fit and zoom controls, plus error and blocked inline image states.</desc>
  <rect width="1200" height="760" fill="#e8ece9"/>
  <g font-family="-apple-system, sans-serif">
    <text x="50" y="48" font-size="24" font-weight="700" fill="#202826">F006 · View local images</text>
    <text x="50" y="72" font-size="14" fill="#52615c">Visual proposal · read-only pixels · quiet controls</text>
    <rect x="50" y="100" width="1100" height="444" rx="12" fill="#fff" stroke="#c8d0cb"/>
    <rect x="50" y="100" width="1100" height="34" rx="12" fill="#f1f3f1"/>
    <circle cx="73" cy="117" r="5" fill="#e37b72"/><circle cx="90" cy="117" r="5" fill="#e7c66c"/><circle cx="107" cy="117" r="5" fill="#82ba83"/>
    <rect x="50" y="134" width="216" height="410" fill="#eef0ee"/>
    <text x="72" y="164" font-size="14" font-weight="700" fill="#202826">assets</text>
    <text x="72" y="195" font-size="12" fill="#52615c">Documents and images</text>
    <text x="72" y="229" font-size="13" fill="#202826">◇ README.md</text>
    <rect x="65" y="242" width="185" height="30" rx="5" fill="#dee9e8"/>
    <text x="72" y="262" font-size="13" fill="#202826">▧ diagram.png</text>
    <text x="72" y="300" font-size="13" fill="#52615c">▧ icon.svg</text>
    <rect x="266" y="134" width="884" height="42" fill="#f8f9f8"/>
    <text x="286" y="161" font-size="13" fill="#52615c">README.md</text>
    <rect x="392" y="137" width="148" height="36" rx="5" fill="#fff" stroke="#d8deda"/>
    <text x="410" y="161" font-size="13" font-weight="700" fill="#202826">▧ diagram.png</text>
    <rect x="266" y="176" width="884" height="58" fill="#fff" stroke="#e0e5e1"/>
    <text x="290" y="200" font-size="15" font-weight="700" fill="#202826">diagram.png</text>
    <text x="290" y="220" font-size="12" fill="#52615c">PNG · 1600 × 900 px · Read-only</text>
    <rect x="266" y="234" width="884" height="45" fill="#f8f9f8"/>
    <rect x="290" y="241" width="42" height="29" rx="5" fill="#dee9e8" stroke="#315f70"/>
    <text x="302" y="261" font-size="13" fill="#202826">Fit</text>
    <text x="348" y="261" font-size="13" fill="#202826">Actual Size</text>
    <text x="455" y="261" font-size="18" fill="#315f70">−</text>
    <text x="489" y="261" font-size="13" fill="#202826">68%</text>
    <text x="535" y="261" font-size="18" fill="#315f70">+</text>
    <text x="595" y="261" font-size="13" fill="#315f70">Reload</text>
    <rect x="266" y="279" width="884" height="265" fill="#f4f5f3"/>
    <rect x="410" y="300" width="580" height="225" rx="4" fill="#dce8e8" stroke="#9db8b7"/>
    <rect x="440" y="333" width="130" height="115" rx="6" fill="#9dc2ba"/>
    <rect x="590" y="333" width="360" height="24" rx="4" fill="#315f70"/>
    <rect x="590" y="373" width="300" height="13" rx="4" fill="#698f8a"/>
    <rect x="590" y="402" width="330" height="13" rx="4" fill="#698f8a"/>
    <rect x="590" y="431" width="235" height="13" rx="4" fill="#698f8a"/>
    <text x="50" y="572" font-size="17" font-weight="700" fill="#202826">1  Verified local image · Fit</text>
    <rect x="50" y="600" width="530" height="120" rx="10" fill="#fff" stroke="#c8d0cb"/>
    <text x="75" y="635" font-size="16" font-weight="700" fill="#202826">Image cannot be displayed</text>
    <text x="75" y="665" font-size="13" fill="#52615c">File changed or format does not match its bytes.</text>
    <text x="75" y="696" font-size="13" fill="#315f70">Retry</text>
    <rect x="620" y="600" width="530" height="120" rx="10" fill="#fff" stroke="#c8d0cb"/>
    <text x="645" y="635" font-size="16" font-weight="700" fill="#202826">Image blocked</text>
    <text x="645" y="665" font-size="13" fill="#52615c">Remote or unsafe source · alt text remains readable</text>
    <text x="50" y="744" font-size="15" fill="#202826">2  Recoverable file error</text>
    <text x="620" y="744" font-size="15" fill="#202826">3  Safe inline placeholder</text>
  </g>
</svg>
