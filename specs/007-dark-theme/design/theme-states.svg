<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <title>Dark theme proposal: reading, appearance choices, and narrow Spanish layout</title>
  <desc>Static vector sketch showing a neutral dark Markdown workspace and Light/System options. This is not a running app screenshot.</desc>
