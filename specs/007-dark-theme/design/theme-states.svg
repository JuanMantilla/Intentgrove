      <text x="20" y="270" fill="#A8B9B1" font-size="13">›  notes</text>
      <rect x="228" y="80" width="892" height="42" fill="#1D2524"/>
      <rect x="228" y="80" width="177" height="42" fill="#202928"/>
      <path d="M228 121H405" stroke="#91C5D6" stroke-width="2"/>
