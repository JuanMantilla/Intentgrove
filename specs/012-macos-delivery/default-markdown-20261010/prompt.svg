<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="#e9e9eb"/><rect x="52" y="54" width="536" height="250" rx="16" fill="#fafafa" stroke="#c6c6c8"/><text x="88" y="105" font-family="-apple-system,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#202024">Open Markdown files with Intentgrove?</text><text x="88" y="145" font-family="-apple-system,Helvetica,sans-serif" font-size="15" fill="#404047">Make Intentgrove the default app for .md and</text><text x="88" y="169" font-family="-apple-system,Helvetica,sans-serif" font-size="15" fill="#404047">.markdown files. macOS may ask you to confirm</text><text x="88" y="193" font-family="-apple-system,Helvetica,sans-serif" font-size="15" fill="#404047">the change.</text><rect x="270" y="236" width="135" height="34" rx="7" fill="#fff" stroke="#bbbbc0"/><text x="337" y="258" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="14">Make Default</text><rect x="418" y="236" width="126" height="34" rx="7" fill="#087cf0"/><text x="481" y="258" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="14" fill="#fff">Not Now</text><text x="55" y="333" font-family="Helvetica,sans-serif" font-size="12" fill="#555">Review sketch · Native macOS controls will follow system appearance</text></svg>