<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">macOS delivery interaction proposal</title><desc id="desc">Native menu, Finder entry, drop feedback and dirty close states.</desc>
