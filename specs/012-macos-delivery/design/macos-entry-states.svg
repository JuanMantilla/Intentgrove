<rect x="42" y="80" width="270" height="260" rx="7" fill="#f4f5f3"/><text x="60" y="113" font-family="sans-serif" font-size="18" fill="#202826">Finder Open With</text><text x="60" y="150" font-family="sans-serif" font-size="14" fill="#52615c">Exact selected file only</text><text x="60" y="205" font-family="sans-serif" font-size="18" fill="#202826">Window drop</text><text x="60" y="240" font-family="sans-serif" font-size="14" fill="#52615c">Validated file or folder</text>
