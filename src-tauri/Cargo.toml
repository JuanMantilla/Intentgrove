[package]
name = "md_reader"
version = "0.1.0"
description = "Intentgrove — a document workspace for clearer communication with AI"
authors = ["Juan Mantilla"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Rust's debuginfo stripping can misalign proc-macro dylibs, which macOS 27
# refuses to load (E0463). Keep build-time libraries intact.
[profile.release.build-override]
strip = "none"

[features]
default = []
acceptance-harness = []
html-native-probe = []
settings-contract-tests = ["tauri/test"]
document-contract-tests = []

[build-dependencies]
serde_json = "=1.0.151"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
igproto-model = { path = "../crates/igproto-model" }
igproto-package = { path = "../crates/igproto-package" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
notify = "=8.2.0"
sha2 = "=0.10.9"
pulldown-cmark = "=0.13.4"
serde_json = "=1.0.151"
ignore = "=0.4.22"
globset = "=0.4.14"
regex = "=1.12.2"
dom_query = "=0.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "protocol"] }
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse"] }
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Threading"] }

[[bin]]
name = "html-native-probe"
path = "src/html_probe_main.rs"
required-features = ["html-native-probe"]

[[test]]
name = "automatic_refresh"
path = "tests/automatic_refresh.rs"
required-features = ["document-contract-tests"]

[[test]]
name = "manual_reload"
path = "tests/manual_reload.rs"
required-features = ["document-contract-tests"]

[[test]]
name = "refresh_conflict"
path = "tests/refresh_conflict.rs"
required-features = ["document-contract-tests"]

[[test]]
name = "refresh_recovery"
path = "tests/refresh_recovery.rs"
required-features = ["document-contract-tests"]

[[test]]
name = "refresh_version"
path = "tests/refresh_version.rs"
required-features = ["document-contract-tests"]

[[test]]
name = "windows_scoped"
path = "tests/windows_scoped.rs"
required-features = ["document-contract-tests"]
